<!-- 
Create a HTML page to display a new image and text when the mouse comes over the existing content in the page using JavaScript Event Handling mechanism. -->

<html>
    <head>
        <title>Mouseover Event Handling</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                padding-top: 40px;
            }
            #content {
                margin-top: 20px;
                font-size: 18px;
            }
            #newContent {
                display: none;
                margin-top: 20px;
            }
            .image {
                width: 200px;
                height: auto;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <h1>Welcome to the Page</h1>
        <div id="content">
            Hover over this text to see new content.
        </div>
        <div id="newContent">
            <p>Flower!</p>
            <img src="flower.jpg" alt="New Image" class="image">
        </div>

        <script>
            const content = document.getElementById("content");
            const newContent = document.getElementById("newContent");

            content.addEventListener("mouseover", function() {
                newContent.style.display = "block";
            });

            content.addEventListener("mouseout", function() {
                newContent.style.display = "none";
            });
        </script>
    </body>
</html>
