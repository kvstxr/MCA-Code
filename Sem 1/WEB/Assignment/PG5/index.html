<!-- Apply positioning methods of elements on a webpage with div elements and their corresponding classes using two external stylesheets. Compare the output with absolute, and relative positioning of div elements. -->

<html>
    <head>
        <title>Positioning Methods</title>
        <link rel="stylesheet" type="text/css" href="relative.css">
        <link rel="stylesheet" type="text/css" href="absolute.css">
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }
        </style>
    </head>
    <body>
        <div class="relative">This is a relative positioned div.</div>
        <div class="absolute">This is an absolute positioned div.</div>
    </body>
</html>
